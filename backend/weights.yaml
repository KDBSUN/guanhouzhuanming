# ============================================================
# 岁运层权重集中配置（weights.yaml）
# ------------------------------------------------------------
# 证据状态声明（诚实标注原则）：
#   1. "序关系"（旺>相>休>囚>死 的排序）出自典籍，见各值上方出处行；
#   2. 具体数值为【工程默认值，未经案例校准，仅参与比较/参与求和】，
#      不得当作经验验证的精确值引用；
#   3. 校准方式是敏感度分析与反例捕捉（对每个权重 ±20%~30% 观察裁决翻转率），
#      不是拟合"最优值"——术数案例无法做对照实验，拟合即自欺；
#   4. 决策日志记录本文件版本号（weights_version），事后归因以此为锚点。
# ============================================================

version: "1.3.0"

# ------------------------------------------------------------
# 梅花应期的加权与门槛（R7：原先硬编码在应期模块里、不受版本管理，现入池）
# ------------------------------------------------------------
# 序关系出处：《梅花易数·先天卦定应期》"定事应之期，则取之卦气"，应于卦气旺相之日；
#   《体用总诀》应期三法（事成应于生体之卦、事败应于克体之卦）。
# 数值：工程默认值，未经案例校准。**典籍未给权重**——《五行大义·论四时休王》只给
#   "王相休囚死"的次序与物象大小（王时为洪大之物、相时渐小、死时枯朽），不给分数；
#   《增删卜易》李我平更明说"七分八分，何以决疑"。
# 敏感度（2026-09-23 实测）：本组是全站最敏感的自定数字——加权整体 −20% 或门槛 +20%，
#   14 个可复现的真卦里 14 个的应期日期表全变。详见 docs/敏感度分析结果.md。
yingqi:
  # 四支权重：月支 / 日支 / 年支 / 时支
  weights:
    month: 0.80
    day: 0.15
    year: 0.025
    hour: 0.025
  # 旺衰分门槛：≥ 此值才算"这天算数"
  gate: 0.45
  # 月令五态分。**注意**：与上面 shiwang_weight（岁运过秤用）是两套用途不同的取值，
  # 不联动——那套拿去与 strong_threshold 比大小（决定是否参与引动），这套当作加权项求和。
  month_states:
    旺: 1.0
    相: 0.7
    休: 0.4
    囚: 0.2
    死: 0.1
  # 日/年/时支与目标五行的关系分
  other_states:
    同: 1.0
    生: 0.7      # 该支生我
    泄: 0.3      # 我泄于该支
    我克: 0.3
    被克: 0.1

# 流年五行相对起卦月令的旺相休囚死权重
# 序关系出处：《渊海子平》/《五行大义》"当令者旺，我生者相，生我者休，克我者囚，我克者死"
# 数值：工程默认值，未经案例校准；仅用于"失令近乎不计"的阈值比较，不参与求和
shiwang_weight:
  旺: 1.0    # 工程默认值，未经案例校准
  相: 0.8    # 工程默认值，未经案例校准
  休: 0.5    # 工程默认值，未经案例校准（休为强/弱的分界）
  囚: 0.3    # 工程默认值，未经案例校准（囚死近乎不计）
  死: 0.2    # 工程默认值，未经案例校准（囚死近乎不计）

# 参与引动的最低权重阈值（≥此值流年才参与升降档）
# 序关系出处：《梅花易数·衰旺诀》"生扶体卦之气宜旺，克体之气宜衰"（旺相有效，囚死不计）
# 数值：工程默认值，未经案例校准；纯阈值比较，不参与求和
strong_threshold: 0.5

# 择日引擎"宜日"所需的日辰状态（旺相为应期日）
# 序关系出处：《梅花易数·先天卦定应期》"定事应之期，则取之卦气"，应于卦气旺相之日
# 数值/集合：工程默认值，未经案例校准
zeri_yi_states: ["旺", "相"]

# 择日观察窗口天数（按档位：S=7 / M=30 / L=30）
# 出处：tiering 档位契约（紧急=近事体窗，中期=季度，长期=年度）
# 数值：工程默认值，未经案例校准
#
# M 由 14 改为 30（2026-09-18，站长定）。原因：14 天窗口覆盖不到"本月内要办的事"
# ——实测中用户要谈的日子在第 20 天，落在窗外，于是 AI 只能自己推日期，并推错了一个。
# 窗口是"给 AI 多少依据"，不是"给用户看多长建议"，所以宁宽勿窄。
# 注：M 与 L 现在同为 30，两者差别只在 AI 输出层数（M 两层 / L 三层），仍是可辨的。
zeri_days:
  S: 7
  M: 30
  L: 30

# ------------------------------------------------------------
# 流动五行判定表阈值（R4：原先硬编码在 wuxing_flow.py / wuxing_quality.py，现入池集中管理）
# ------------------------------------------------------------
# 状态分档（弱极/弱/中和偏旺/旺极）：由 命局五行数量 + 月令五态加成 折算成分后比较
# 序关系出处：《元理赋》强弱四态之书理（弱则补母、旺则泄或用克）
# 数值：工程默认值，未经案例校准；仅决定"显示哪一档"，不进裁决管线（不改红黄绿）
flow_thresholds:
  state_jiruo_max: 1.0     # 分 < 此值（或该五行数量为 0）→ 弱极
  state_weak_max: 3.0      # 分 < 此值 → 弱；≥ state_strong_min → 旺极，其余中和偏旺
  state_strong_min: 6.0
  chengwu_margin: 1.0      # 乘侮三值化：攻守势均带宽度 δ（比值锚点 1.0）；差 ≥ δ 即判 乘/侮
                           # 序关系出处：《素问·五运行大论》四路径坍缩为比值两态（"制则生化"为势均锚点）
                           # 数值：工程默认值，未经案例校准；仅显示层调制，不反转喜忌
  month_boost_wang: 1.0    # 月令五态"旺"给乘侮的力量加成
  month_boost_xiang: 0.5   # 月令五态"相"给乘侮的力量加成
  # 干支级力量代理（R2）：藏干权重（本气/中气/余气）
  # 序关系出处：《渊海子平》藏干（人元）以本气为重
  # 数值：工程默认值，未经案例校准
  hidden_qi_weights:
    本气: 1.0
    中气: 0.6
    余气: 0.4
  # 边界样本带宽：判据值与阈值之差 ≤ 此值即记入边界台账（供校准提案使用）
  # 数值：工程默认值，未经案例校准
  boundary_band: 0.3

# ------------------------------------------------------------
# 校准护栏（反馈 → 数值调整的唯一通道的硬限制）
# ------------------------------------------------------------
# 原则（与上文证据状态声明一致）：术数案例无对照组，**只做边界翻转监控，绝不拟合**。
# 流程：边界样本自动记账 → claim 级反馈回流 → 达护栏即生成"待批"校准提案 → 人工批准后改本文件并升版本。
calibration:
  min_samples: 5          # 最小有效反馈数（低于此不提案）
  min_same_direction: 4   # 同向样本数下限
  max_delta_ratio: 0.3    # 单次变动幅度上限（相对旧值 ±30%）
  flip_rate_threshold: 0.6  # 边界样本"未验/反向"占比达到此值才提案

# ------------------------------------------------------------
# 八字取用裁决（2026-09-23 H5）：调候字与忌神相重时的处置
# ------------------------------------------------------------
# 书证与层级见 docs/调候与改方书证登记.md，此处只记数值口径：
#   ① 从格成格 → 调候让位（《子平真诠》「调候亦然。倘格局转变则不在此例」，评注页）；
#   ② 火土旺极/重逢 → 无须调候（《穷通宝鉴评注》「若火土重逢，无须调候」，
#      「除非四柱火土旺极」——均徐乐吾注）；
#   ③ 其余 → 调候为急，权而用之（《子平真诠·论用神配气候得失》原文），调候字移出忌神表。
# 书中对"火土旺极/重逢"只给定性、未给数量，以下门槛为工程默认值。
xiji:
  huo_tu_wangji_min: 6    # 火+土 合计字数 ≥ 此值 视为火土旺极/重逢 → 调候让位
